# Configuration du modèle spécialisé dans le qa
# hermes chat -p qa
model:
  provider: "kilo"
  default: "anthropic/claude-haiku-5.5"

# Les outils (toolsets) sont activés globalement ou par set
enabled_toolsets:
  - "filesystem"                  # Active read, write, patch, list_dir
  - "terminal"                    # Active execute_command
